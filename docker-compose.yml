# Development database only. The app itself runs on the host (php artisan serve / composer dev).
services:
    mysql:
        image: mysql:8.4
        container_name: buggcoin-mysql
        restart: unless-stopped
        ports:
            # 3307 on the host to avoid clashing with other local MySQL containers on 3306.
            - '127.0.0.1:${DB_PORT:-3307}:3306'
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-buggcoin}
            MYSQL_USER: ${DB_USERNAME:-buggcoin}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        volumes:
            - buggcoin-mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent',
                ]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    buggcoin-mysql-data:
